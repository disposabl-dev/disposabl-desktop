name: Desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check, test, and build once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: actions/cache@v6
        with:
          path: .cache/bun
          key: checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: checks-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types, lint, and formatting
        run: bun run validate:check
      - name: Unit tests
        run: bun run test
      - name: Bundle app
        run: bun run build
      - name: Share the platform-independent bundle
        uses: actions/upload-artifact@v6
        with:
          name: app-bundle
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 1

  package:
    name: ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            flags: --win --x64
            executable: release/win-unpacked/Disposabl Desktop.exe
          - platform: macos-arm64
            runner: macos-15
            flags: --mac --arm64
            executable: release/mac-arm64/Disposabl Desktop.app/Contents/MacOS/Disposabl Desktop
          - platform: ubuntu-x64
            runner: ubuntu-24.04
            flags: --linux --x64
            executable: release/linux-unpacked/disposabl-desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Cache native packaging tools
        uses: actions/cache@v6
        with:
          path: .cache
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Install desktop tooling from cache
        run: bun install --frozen-lockfile --filter @disposabl/desktop
      - uses: actions/download-artifact@v7
        with:
          name: app-bundle
          path: apps/desktop/dist
      - name: Build installers
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run package:bundle ${{ matrix.flags }} "-c.extraMetadata.version=0.1.${{ github.run_number }}"
      - name: Smoke test the packaged app
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          APP_EXECUTABLE: ${{ matrix.executable }}
        run: bun run test:smoke
      - name: Verify macOS DMG, app signature, and launch
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: bash scripts/test-macos-dmg.sh release/*.dmg
      - name: Smoke test the packaged app on Ubuntu
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        env:
          APP_EXECUTABLE: ${{ matrix.executable }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum bun run test:smoke
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-${{ matrix.platform }}
          path: apps/desktop/test-results/*.png
          if-no-files-found: warn
      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  release:
    name: Publish release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.1.${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd installers
          sha256sum *.exe *.dmg *.AppImage *.deb > SHA256SUMS.txt
          cat > ../release-notes.md <<'EOF'
          Minimal Electron app built with Bun canary.

          Downloads: Windows x64 installer, Apple Silicon DMG, Ubuntu x64 AppImage and Debian package.

          The macOS app has an ad-hoc signature verified after copying it from the DMG. It is not Apple Developer ID signed or notarized. macOS Gatekeeper still requires approval in System Settings > Privacy & Security > Open Anyway. Windows builds are unsigned and SmartScreen may show a warning.
          EOF
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --notes-file ../release-notes.md --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" ./*.exe ./*.dmg ./*.AppImage ./*.deb SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
